  <g transform="translate(620, 150)" filter="url(#shadow)">
    <rect width="210" height="470" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 200 0 Q 210 0 210 10 L 210 38 L 0 38 Z" fill="#1e293b"/>
    <circle cx="18" cy="19" r="4" fill="#a855f7"/>
    <text x="32" y="23" fill="#f8fafc" font-size="12" font-weight="700">3. AI ROADBOOK SYNTHESIS</text>

    <!-- Prompt Injection -->
    <g transform="translate(16, 52)">
      <rect width="178" height="86" rx="6" fill="#0b111e" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-size="10" font-weight="700">PROMPT INJECTION</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10">Injects actual road names</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="10">Injects real distances</text>
      <text x="12" y="66" fill="#cbd5e1" font-size="10">Injects Overpass lakes/POIs</text>
      <text x="12" y="80" fill="#f43f5e" font-size="10" font-weight="700">"Zero Hallucination" Rules</text>
    </g>

    <!-- Official Free Gemini -->
    <g transform="translate(16, 148)">
      <rect width="178" height="126" rx="6" fill="#0b111e" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="12" y="10" width="154" height="20" rx="3" fill="#2563eb" fill-opacity="0.2"/>
      <text x="16" y="24" fill="#60a5fa" font-size="10" font-weight="700">GOOGLE GEMINI 3.5 LITE</text>
      <text x="12" y="48" fill="#ffffff" font-size="12" font-weight="700">@google/genai SDK</text>
      <text x="12" y="66" fill="#93c5fd" font-size="10">Free Official Model</text>
      <text x="12" y="82" fill="#94a3b8" font-size="10">• High-speed token synthesis</text>
      <text x="12" y="96" fill="#94a3b8" font-size="10">• 4-Pillar JSON schema output</text>
      <text x="12" y="110" fill="#94a3b8" font-size="10">• Auto-fallback: 2.5-flash-lite</text>
      <text x="12" y="122" fill="#94a3b8" font-size="9">• Zero search-tool quota block</text>
    </g>

    <!-- Fallback Synthesizer -->
    <g transform="translate(16, 284)">
      <rect width="178" height="96" rx="6" fill="#0b111e" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#f59e0b" font-size="10" font-weight="700">RESILIENT MULTI-FALLBACK</text>
      <text x="12" y="38" fill="#e2e8f0" font-size="10" font-weight="600">1. Gemini 3.5 Flash Lite</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="10">2. Gemini 2.5 Flash Lite/Flash</text>
      <text x="12" y="66" fill="#cbd5e1" font-size="10">3. OpenRouter Free Router</text>
      <text x="12" y="80" fill="#10b981" font-size="10" font-weight="600">4. Live Data Grounded Engine</text>
      <text x="12" y="92" fill="#94a3b8" font-size="9">(100% offline mathematical)</text>
    </g>

    <!-- Normalizer -->
    <g transform="translate(16, 390)">
      <rect width="178" height="66" rx="6" fill="#0b111e" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#10b981" font-size="10" font-weight="700">NORMALIZER &amp; AUDITOR</text>
      <text x="12" y="34" fill="#cbd5e1" font-size="10">Calculates true total distance</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="10">Validates pass status keys</text>
      <text x="12" y="62" fill="#cbd5e1" font-size="10">Populates missing pillars</text>
    </g>
  </g>

  <!-- Connect 3 -> 4 -->
  <line x1="830" y1="360" x2="875" y2="360" stroke="#ff8c00" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Phase 4: Delivered Outputs -->
  <g transform="translate(880, 150)" filter="url(#shadow)">
    <rect width="180" height="470" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 170 0 Q 180 0 180 10 L 180 38 L 0 38 Z" fill="#1e293b"/>
    <circle cx="18" cy="19" r="4" fill="#10b981"/>
    <text x="32" y="23" fill="#f8fafc" font-size="12" font-weight="700">4. BIKER OUTPUTS</text>

    <!-- Pass Banner -->
    <g transform="translate(14, 52)">
      <rect width="152" height="74" rx="6" fill="#0b111e" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" fill="#ef4444" font-size="9.5" font-weight="700">PASS STATUS BANNER</text>
      <text x="10" y="34" fill="#f1f5f9" font-size="11" font-weight="600">Route Pass Matrix</text>
      <text x="10" y="50" fill="#94a3b8" font-size="10">• Babusar Top: CLOSED</text>
      <text x="10" y="64" fill="#94a3b8" font-size="10">• KKH N-35: OPEN</text>
    </g>

    <!-- 4-Pillar Day Cards -->
    <g transform="translate(14, 136)">
      <rect width="152" height="152" rx="6" fill="#0b111e" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="20" fill="#38bdf8" font-size="10" font-weight="700">4-PILLAR DAY CARDS</text>
      <text x="10" y="38" fill="#f1f5f9" font-size="10.5" font-weight="600">Pillar 1: Highway</text>
      <text x="10" y="52" fill="#94a3b8" font-size="9.5">• Exact corridor codes</text>
      <text x="10" y="70" fill="#f1f5f9" font-size="10.5" font-weight="600">Pillar 2: POI Timeline</text>
      <text x="10" y="84" fill="#94a3b8" font-size="9.5">• Lakes, passes &amp; stops</text>
      <text x="10" y="102" fill="#f1f5f9" font-size="10.5" font-weight="600">Pillar 3: Road Surface</text>
      <text x="10" y="116" fill="#94a3b8" font-size="9.5">• Asphalt, gravel, mud</text>
      <text x="10" y="134" fill="#f1f5f9" font-size="10.5" font-weight="600">Pillar 4: Logistics</text>
      <text x="10" y="148" fill="#94a3b8" font-size="9.5">• Fuel, mechanic, SCOM</text>
    </g>

    <!-- Rally Roadbook PDF -->
    <g transform="translate(14, 298)">
      <rect width="152" height="152" rx="6" fill="#0b111e" stroke="#ff7a00" stroke-width="1.5"/>
      <rect x="8" y="8" width="136" height="20" rx="3" fill="#ff7a00" fill-opacity="0.2"/>
      <text x="12" y="22" fill="#ff9933" font-size="9" font-weight="700">TACTICAL ROADBOOK</text>
      <text x="10" y="44" fill="#ffffff" font-size="11" font-weight="700">Offline PDF Export</text>
      <text x="10" y="60" fill="#fed7aa" font-size="9.5">• High-contrast black header</text>
      <text x="10" y="74" fill="#fed7aa" font-size="9.5">• Sunlight readable on tank</text>
      <text x="10" y="88" fill="#fed7aa" font-size="9.5">• Pass Status Matrix</text>
      <text x="10" y="102" fill="#fed7aa" font-size="9.5">• 4-Pillar Daily Tables</text>
      <text x="10" y="116" fill="#fed7aa" font-size="9.5">• Emergency Numbers (1122)</text>
      <text x="10" y="130" fill="#fed7aa" font-size="9.5">• Gear &amp; NOC Checklist</text>
      <text x="10" y="144" fill="#22c55e" font-size="9.5" font-weight="700">Zero Internet Required</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="550" y="650" fill="#64748b" font-size="11" text-anchor="middle">RaahBar v1 MVP • High-Altitude Motorcycle Tour Engineer • Built for Pakistan's Karakoram, Himalayas &amp; Hindukush</text>
</svg>

